<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Puzzles</title>

    <link rel="icon" type="image/x-icon" href="images/favicon.png">

    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/slitherlink.css">

    <script src="js/bootstrap.bundle.js"></script>
    <script src="js/sat.js"></script>

    <script src="js/utilities/utils.js"></script>
    <script src="js/utilities/event-emitter.js"></script>

    <script src="js/grid/grid.js"></script>
    <script src="js/grid/grid-renderer.js"></script>
    <script src="js/grid/square-grid.js"></script>
    <script src="js/grid/honeycomb-grid.js"></script>
    <script src="js/grid/hex-grid.js"></script>
    <script src="js/grid/triangular-grid.js"></script>
    <script src="js/grid/pentagram-grid.js"></script>
    <script src="js/grid/cairo-grid.js"></script>

    <script src="js/games/game.js"></script>
    <script src="js/games/commons/loop-gen.js"></script>
    <script src="js/games/commons/sat-utils.js"></script>
    <script src="js/games/slitherlink/slitherlink.js"></script>
    <script src="js/games/shingoki/shingoki.js"></script>
    <script src="js/games/debug-game.js"></script>

    <script src="js/games/game-generation-progress-renderer.js"></script>

    <script src="js/themes.js"></script>

    <script src="js/app.js"></script>
    <script src="js/board-controls.js"></script>
    <script src="js/app.dropdown.js"></script>
</head>
<body>

<main class="app-shell">
    <header class="app-header">
        <h1 id="currentGameTitle">Slitherlink</h1>
        <div class="header-actions"><div class="timer"><span>TIME</span><p id="timebox">00:00</p></div>
        <button id="openSettings" class="btn tool" aria-haspopup="dialog">New</button></div>
    </header>
    <dialog id="settingsDialog" aria-labelledby="settingsTitle">
    <div class="settings-heading"><h2 id="settingsTitle">New puzzle</h2><button id="closeSettings" class="btn tool" aria-label="Close new puzzle panel">✕</button></div>
    <section class="settings" aria-label="New puzzle settings">
        <label>Puzzle<select id="gameInput" class="form-select"><option value="slitherlink">Slitherlink</option><option value="shingoki">Shingoki</option></select></label>
        <label>Grid<select id="gridTypeInput" class="form-select"></select></label>
        <label>Difficulty<select id="difficultyInput" class="form-select"></select></label>
        <label>Puzzle size<select id="sizeInput" class="form-select"></select></label>
        <button id="newGameButton" class="btn btn-new">New puzzle</button>
    </section>
    </dialog>
    <section class="board-card" aria-label="Puzzle board">
        <div class="board-toolbar"><div class="history"><button id="undoButton" class="btn tool" title="Undo" aria-label="Undo">↶ <span>Undo</span></button><button id="redoButton" class="btn tool" title="Redo" aria-label="Redo">↷ <span>Redo</span></button></div>
        <div id="toolbarTheme"></div>
        <button id="restartButton" class="btn tool" aria-label="Restart puzzle">↻ <span>Restart</span></button></div>
        <div class="board-viewport"><canvas id="canvas" aria-label="Interactive puzzle. Tap to play, drag to pan, pinch to zoom."></canvas><div id="generationStatus" role="status">Generating puzzle…</div></div>
        <footer class="board-footer"><p>Tap to play · Drag to move · Pinch or scroll to zoom</p></footer>
    </section>
    <div class="appearance"><label for="themeInput">Board theme</label><select id = "themeInput" class="form-select" aria-label="Theme">
                            <option value="DEFAULT" selected>Default</option>
                            <option value="CLEAN_CLASSIC">Clean Classic</option>
                            <option value="DARK_NEON">Dark Neon</option>
                            <option value="ANCIENT_PAPER">Ancient Paper</option>
                            <option value="SOFT_PASTEL">Soft Pastel</option>
                            <option value="ICE_TECH">Ice Tech</option>
                            <option value="HIGH_CONTRAST_ARCADE">High Contrast Arcade</option>
                            <option value="ELEGANT_GOLD">Elegant Gold</option>
                            <option value="MOSS_AND_STONE">Moss &amp; Stone</option>
                        </select></div>
</main>

<script>
    const debugGrid = false;
    const debugGame = false;

    let theme, grid, game, renderer;
    let startGameTime;
    let playing = false;

    const timebox = document.getElementById("timebox");

    const gridTypeInput = document.getElementById("gridTypeInput");
    const sizeInput = document.getElementById("sizeInput");
    const difficultyInput = document.getElementById("difficultyInput");
    const newGameButton = document.getElementById("newGameButton");

    const undoButton = document.getElementById("undoButton");
    const redoButton = document.getElementById("redoButton");
    const themeInput = document.getElementById("themeInput");
    const restartButton = document.getElementById("restartButton");

    const gameInput = document.getElementById("gameInput");

    const canvas = document.getElementById("canvas");
    const settingsDialog = document.getElementById('settingsDialog');
    document.getElementById('toolbarTheme').append(document.querySelector('.appearance'));
    document.getElementById('openSettings').onclick = () => settingsDialog.showModal();
    document.getElementById('closeSettings').onclick = () => settingsDialog.close();
    settingsDialog.addEventListener('click', event => {
        if (event.target !== settingsDialog) return;
        const rect = settingsDialog.getBoundingClientRect();
        if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) settingsDialog.close();
    });

    const app = new PuzzlesApp(debugGrid, debugGame);

    buildSelect(gridTypeInput, app.getGridTypes(gameInput.value));
    buildSelect(sizeInput, app.getSizeTypes());
    buildSelect(difficultyInput, app.getDifficultyTypes());

    gameInput.addEventListener("change", () => {
        buildSelect(gridTypeInput, app.getGridTypes(gameInput.value));
    });

    newGameButton.addEventListener("click", () => {
        settingsDialog.close();
        newGame()
    });

    themeInput.addEventListener("change", () => {
        theme = Themes[themeInput.value];
        renderer.draw(theme);
    })

    restartButton.addEventListener("click", () => {
       game.restart();
       renderer.finished = false;
       renderer.draw(theme);
       setUndoRedoDisabledState();
    });

    undoButton.addEventListener("click", () => {
        game.undo();
        renderer.draw(theme);
        setUndoRedoDisabledState();
    });

    redoButton.addEventListener("click", () => {
        game.redo();
        renderer.draw(theme);
        setUndoRedoDisabledState();
    });

    new BoardControls(canvas, () => renderer);
    let timerId;
    newGame();

    function newGame() {
        newGameButton.disabled = true;
        playing = false;
        clearTimeout(timerId);
        timebox.innerText = '00:00';
        document.getElementById('generationStatus').hidden = false;
        gameInputElementState(true);

        theme = Themes[themeInput.value];
        grid = app.buildGrid(gridTypeInput.value, sizeInput.value);
        game = app.newGame(gameInput.value, grid, difficultyInput.value);
        document.getElementById('currentGameTitle').textContent = gameInput.selectedOptions[0].text;


        renderer = new GridRenderer(grid, canvas, app.getEdgeSize(gridTypeInput.value));
        renderer.debug = debugGame;
        window.renderer = renderer;
        renderer.draw(theme);

        renderer.on("dotClicked", dot => {
            game.onDotClick(dot);
            renderer.draw(theme);
            setUndoRedoDisabledState();
        });

        renderer.on("edgeClicked", edge => {
            game.onEdgeClick(edge);
            renderer.draw(theme);
            setUndoRedoDisabledState();
        });

        renderer.on("faceClicked", face => {
            game.onFaceClick(face);
            renderer.draw(theme);
            setUndoRedoDisabledState();
        });

        game.on("generate-progress", (progress) => {
            document.getElementById('generationStatus').textContent = `Generating puzzle… ${Math.round(progress * 100)}%`;
        });

        game.on("generate-end", () => {
            newGameButton.disabled = false;
            gameInputElementState(false);
            document.getElementById('generationStatus').hidden = true;
            renderer.enabled = true;
            playing = true;
            startGameTime = Date.now();
            timerId = setTimeout(function timer() {
                const millis = Date.now() - startGameTime;

                const seconds = Math.floor((millis / 1000) % 60)
                const minutes = Math.floor((millis / 1000) / 60);

                timebox.innerText = `${minutes < 10 ? '0' + minutes : minutes}:${seconds < 10 ? '0' + seconds : seconds}`;

                if (playing) {
                    timerId = setTimeout(timer, 1000);
                }
            }, 1000);
            renderer.draw(theme);
        });

        game.on("finish", () => {
            playing = false;
            renderer.finished = true;
            renderer.draw(theme);
        });

        setUndoRedoDisabledState();
    }

    function gameInputElementState(disabled) {
        gameInput.disabled = disabled;
        restartButton.disabled = disabled;
    }

    function setUndoRedoDisabledState() {
        undoButton.disabled = !game.canUndo();
        redoButton.disabled = !game.canRedo();
    }

    function buildSelect(select, options) {
        select.options.length = 0;
        Object.getOwnPropertyNames(options)
            .forEach((prop) => select.options.add(new Option(options[prop], prop)));
    }
</script>

</body>
</html>
